name: Collect MTG price snapshot

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch: {}     # run manually from Actions tab any time

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # silences the Node.js 20 deprecation warning
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas pyarrow huggingface_hub ijson

      - name: Run collector
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python collector.py

      - name: Confirm upload
        run: echo "Snapshot collected and pushed to Hugging Face successfully."
